# 让 tailnet 主机名通过浏览器信任栅栏，并挂载插件。
# 行 id 不能用 remote-access（web-app 已占用 dsh-api-remote-access）。
# 部署方可用 DSH_REMOTE_TRUSTED_HOSTS 环境变量，或在自己的 profile patch 里
# 覆盖 connection.config.trustedHosts（profile patch 在本 bundle 之后应用）。
- id: connection
  config:
    trustedHosts: !!js (process.env.DSH_REMOTE_TRUSTED_HOSTS ?? '').split(',').map((s) => s.trim()).filter(Boolean)
- insert:
    - id: remote-access-link
      name: dsh-plugin-remote-access
